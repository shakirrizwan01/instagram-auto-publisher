name: Paradox Vault YouTube Shorts Publisher

# PAUSED: Schedule paused by user request
# on:
#   schedule:
#     # Tuesday & Friday: 18:00 IST (12:30 UTC)
#     - cron: '30 12 * * 2,5'
#     # Thursday (The Ramp-Up): 19:00 IST (13:30 UTC)
#     - cron: '30 13 * * 4'
#     # Saturday (Maximum Reach): 17:00 IST (11:30 UTC)
#     - cron: '30 11 * * 6'
on:
  workflow_dispatch:
    inputs:
      target_row:
        description: 'Specific row to publish (optional, e.g. 2)'
        required: false
        default: ''

jobs:
  publish-paradox-vault-yt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run YouTube Shorts Publisher
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.target_row }}" ]; then
            python publish_paradox_vault_yt.py --row ${{ github.event.inputs.target_row }}
          else
            python publish_paradox_vault_yt.py
          fi
